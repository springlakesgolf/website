# Refreshes the members page list of club Mailchimp emails every hour.
name: Club emails
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: club-emails
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/members/club_emails.py
      - name: Commit if changed
        run: |
          git add assets/data/club-emails.json
          if git diff --cached --quiet; then echo "no new emails"; exit 0; fi
          git config user.name "club-emails bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh club emails"
          git push
