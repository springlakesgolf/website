# Publishes only the public pages and assets (tools/publish.py). Without this, GitHub Pages serves the
# whole checkout, including tools/dining/staff.html, staff.js and cancel.html (staff only).
# Before the first run: Settings > Pages > Source must be "GitHub Actions".
name: Pages
on:
  push: { branches: [main] }
  # the club-emails bot pushes with GITHUB_TOKEN, which starts no push workflows
  workflow_run: { workflows: ["Club emails"], types: [completed] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  # build and deploy are separate jobs (GitHub's Pages starter layout): from 2026-11-24 deploy-pages
  # stopped finding an artifact uploaded earlier in the same job ("No artifacts named github-pages")
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Copy public files only
        run: python3 tools/publish.py _site
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
